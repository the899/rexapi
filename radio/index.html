<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=844, height=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>听音悦台</title>
  <link rel="apple-touch-icon" href="/radio/icon.png">
  <link rel="icon" href="/radio/icon.png">
  <link rel="manifest" href="/radio/manifest.json">
  <style>
    /* 定义全局 CSS 变量 */
    :root {
      --bg-color: #1a1a1a; /* 背景颜色：深色 */
      --text-color: #e0e0e0; /* 文字颜色：浅灰 */
      --accent-color: #007bff; /* 强调色：蓝色 */
      --card-size: 155px; /* 卡牌尺寸，固定为 155px */
      --text-size: 1.8rem; /* 文字大小，固定为 1.8rem */
      --safe-area-inset: 0px; /* 无刘海全屏，安全边距为 0 */
    }

    /* 设置页面基础样式，固定尺寸，禁用滚动 */
    html, body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      width: 844px;
      height: 390px;
      background-color: var(--bg-color);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-color);
      touch-action: none; /* 禁止触控滚动 */
    }

    /* 设置 body 样式，水平垂直居中 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 390px;
    }

    /* 卡牌容器，固定 2 行 5 列，居中 */
    .radio-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      width: 100%;
      max-width: calc(var(--card-size) * 5); /* 5 * 155px = 775px */
      height: calc(var(--card-size) * 2); /* 2 * 155px = 310px */
      background-color: transparent; /* 无背景，避免边框效果 */
      border: none; /* 明确移除边框 */
      padding: 0;
      overflow: visible; /* 防止裁剪卡牌圆角 */
      z-index: 1;
    }

    /* 卡牌样式，固定尺寸 */
    .radio-card {
      width: var(--card-size);
      height: var(--card-size);
      min-width: 155px;
      min-height: 155px;
      background-color: var(--bg-color);
      border-radius: 30px; /* 卡牌圆角 */
      border: none; /* 无边框 */
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10; /* 确保卡牌可点击 */
    }

    /* 卡牌文字样式 */
    .radio-card span {
      color: var(--text-color);
      font-size: var(--text-size);
      text-align: center;
      padding: 10px;
      word-break: break-all;
      line-height: 1.2;
      z-index: 1;
    }

    /* 未选中卡牌样式 */
    .radio-card:not(.selected) {
      background-color: var(--bg-color);
    }

    /* 选中卡牌样式，带阴影 */
    .radio-card.selected {
      background-color: #333;
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      z-index: 15;
    }

    /* 卡牌状态图标基础样式 */
    .radio-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 2;
    }

    /* 暂停状态：显示双竖条 */
    .radio-card[data-status="paused"]::after {
      display: block;
      width: 40px;
      height: 40px;
      background: linear-gradient(
        to right,
        #007bff 12px,
        transparent 12px 18px,
        #007bff 18px 30px,
        transparent 30px
      );
    }

    /* 连接中状态：显示旋转加载器 */
    .radio-card[data-status="connecting"]::after {
      display: block;
      width: 40px;
      height: 40px;
      border: 4px solid #007bff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* 错误状态：显示红色感叹号图标 */
    .radio-card[data-status="error"]::after {
      display: block;
      width: 40px;
      height: 40px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>') no-repeat center;
      background-size: contain;
    }

    /* 隐藏音频播放器 */
    audio {
      display: none;
    }

    /* 旋转动画 */
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="radio-grid"></div>
  <audio id="radio-player"></audio>
  <script>
    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/radio/sw.js')
          .catch(err => console.error('Service Worker 注册失败:', err));
      });
    }

    // 获取 DOM 元素
    const radioGrid = document.querySelector('.radio-grid');
    const player = document.getElementById('radio-player');
    let currentCard = null;
    let retryTimeout = null;
    let retryCount = 0;
    const maxRetries = 5;
    let isUserPaused = false;
    let playCheckInterval = null;

    // 设置网格最大宽度（固定 5 列）
    const setGridMaxWidth = () => {
      radioGrid.style.maxWidth = '775px'; // 5 * 155px
    };

    // 创建卡牌元素
    const createCard = (name, streamUrl) => {
      const card = document.createElement('div');
      card.className = 'radio-card';
      card.dataset.stream = streamUrl;
      card.innerHTML = `<span>${name}</span>`;
      return card;
    };

    // 更新卡牌状态
    const updateCardStatus = (card, status) => {
      card.dataset.status = status;
    };

    // 绑定卡牌点击事件
    const bindCardEvents = (card) => {
      card.addEventListener('click', () => {
        const streamUrl = card.dataset.stream;
        if (currentCard === card) {
          if (!player.paused) {
            player.pause();
            updateCardStatus(card, 'paused');
            isUserPaused = true;
            localStorage.setItem('lastStatus', 'paused');
          } else {
            isUserPaused = false;
            retryCount = 0;
            retryPlay(card, streamUrl);
          }
        } else {
          document.querySelectorAll('.radio-card').forEach(c => {
            c.classList.remove('selected');
            updateCardStatus(c, '');
          });
          card.classList.add('selected');
          currentCard = card;
          localStorage.setItem('lastStream', streamUrl);
          localStorage.setItem('lastStatus', 'playing');
          isUserPaused = false;
          retryCount = 0;
          retryPlay(card, streamUrl);
        }
      });
    };

    // 加载频道列表（前 10 个频道）
    const loadChannels = async () => {
      try {
        const response = await fetch('/radio/config.json');
        if (!response.ok) {
          throw new Error(`HTTP 错误: ${response.status} ${response.statusText}`);
        }
        const channels = await response.json();
        if (!channels || typeof channels !== 'object') {
          throw new Error('config.json 格式无效，需为对象格式');
        }

        radioGrid.innerHTML = '';
        Object.keys(channels).slice(0, 10).forEach(name => {
          const card = createCard(name, channels[name]);
          radioGrid.appendChild(card);
          bindCardEvents(card);
        });

        setGridMaxWidth();
      } catch (err) {
        console.error('加载频道失败:', err.message);
        radioGrid.innerHTML = `<p style="text-align: center; padding: 20px;">文件加载错误：${err.message}</p>`;
        setGridMaxWidth();
      }
    };

    // 播放电台流
    const retryPlay = (targetCard, streamUrl) => {
      const retryInterval = ('standalone' in navigator && navigator.standalone) ? 5000 : 3000;
      if (retryTimeout) clearTimeout(retryTimeout);
      if (playCheckInterval) clearInterval(playCheckInterval);

      if (player.src === streamUrl && !player.paused && player.currentTime > 0 && player.readyState >= 2) {
        updateCardStatus(targetCard, 'playing');
        isUserPaused = false;
        retryCount = 0;
        return;
      }

      if (retryCount >= maxRetries) {
        updateCardStatus(targetCard, 'error');
        return;
      }

      updateCardStatus(targetCard, 'connecting');
      if (player.src !== streamUrl) {
        player.src = streamUrl;
        player.load(); // 确保重新加载流
      }

      player.play().then(() => {
        playCheckInterval = setInterval(() => {
          if (!player.paused && player.currentTime > 0 && player.readyState >= 2) {
            updateCardStatus(targetCard, 'playing');
            isUserPaused = false;
            localStorage.setItem('lastStatus', 'playing');
            retryCount = 0;
            clearInterval(playCheckInterval);
            if (retryTimeout) clearTimeout(retryTimeout);
          } else if (player.paused && player.readyState < 2) {
            updateCardStatus(targetCard, 'error');
            retryCount++;
            if (retryCount < maxRetries) {
              retryTimeout = setTimeout(() => retryPlay(targetCard, streamUrl), retryInterval);
            }
          }
        }, 1000);
      }).catch(err => {
        console.error('播放错误:', err);
        updateCardStatus(targetCard, 'error');
        retryCount++;
        if (retryCount < maxRetries) {
          retryTimeout = setTimeout(() => retryPlay(targetCard, streamUrl), retryInterval);
        }
      });
    };

    // 初始化加载频道
    loadChannels();

    // 设置 Media Session
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: '听音悦台',
        artist: '听音悦台',
        album: '在线音乐电台'
      });
      navigator.mediaSession.setActionHandler('play', () => {
        if (currentCard) {
          isUserPaused = false;
          retryCount = 0;
          retryPlay(currentCard, currentCard.dataset.stream);
        }
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        if (currentCard) {
          player.pause();
          updateCardStatus(currentCard, 'paused');
          isUserPaused = true;
          localStorage.setItem('lastStatus', 'paused');
        }
      });
    }

    // 音频播放器事件监听
    player.addEventListener('waiting', () => {
      if (currentCard && player.src) updateCardStatus(currentCard, 'connecting');
    });
    player.addEventListener('playing', () => {
      if (currentCard && player.src && !player.paused && player.currentTime > 0 && player.readyState >= 2) {
        updateCardStatus(currentCard, 'playing');
        isUserPaused = false;
        localStorage.setItem('lastStatus', 'playing');
        retryCount = 0;
        if (retryTimeout) clearTimeout(retryTimeout);
        if (playCheckInterval) clearInterval(playCheckInterval);
      }
    });
    player.addEventListener('pause', () => {
      if (currentCard && player.src && isUserPaused) {
        updateCardStatus(currentCard, 'paused');
        localStorage.setItem('lastStatus', 'paused');
      }
    });
    player.addEventListener('error', () => {
      if (currentCard && player.src && player.paused && player.readyState < 2) {
        updateCardStatus(currentCard, 'error');
        retryCount++;
        const retryInterval = ('standalone' in navigator && navigator.standalone) ? 5000 : 3000;
        if (retryCount < maxRetries) {
          retryTimeout = setTimeout(() => retryPlay(currentCard, currentCard.dataset.stream), retryInterval);
        }
      }
    });
  </script>
</body>
</html>
