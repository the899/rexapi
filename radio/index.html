<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>听音悦台</title>
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" href="./icon.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: #e0e0e0;
      --accent-color: #007bff;
      --card-size: 155px;
      --text-size: 1.8rem;
      --safe-area-inset: 0px;
    }

    /* 根元素样式，确保全屏显示，忽略刘海和 Home Indicator */
    html, body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100vh;
      background-color: var(--bg-color);
      position: fixed;
      top: 0;
      left: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-color);
      touch-action: none;
    }

    /* 主体居中，确保卡牌区域垂直和水平居中 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 卡牌网格容器，居中显示，设置默认竖屏尺寸 */
    .radio-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      width: 100%;
      max-width: calc(var(--card-size) * 2);
      max-height: calc(100vh - 20px);
      background-color: transparent;
      border: none;
      padding: 0;
      overflow: visible;
      z-index: 1;
      gap: 0;
      box-sizing: border-box;
      padding-bottom: env(safe-area-inset-bottom);
      margin: auto;
    }

    /* 横屏样式：2 行 5 列，775x310px */
    @media (orientation: landscape) {
      .radio-grid {
        max-width: calc(var(--card-size) * 5);
        max-height: calc(var(--card-size) * 2);
        flex-flow: row wrap;
      }
    }

    /* 竖屏样式：5 行 2 列，310x775px */
    @media (orientation: portrait) {
      .radio-grid {
        max-width: calc(var(--card-size) * 2);
        max-height: calc(var(--card-size) * 5);
        flex-flow: column wrap;
      }
    }

    /* 卡牌样式，固定 155x155px，圆角 30px */
    .radio-card {
      width: var(--card-size);
      height: var(--card-size);
      background-color: var(--bg-color);
      border-radius: 30px;
      border: none;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .radio-card span {
      color: var(--text-color);
      font-size: var(--text-size);
      text-align: center;
      padding: 10px;
      word-break: break-all;
      line-height: 1.2;
      z-index: 1;
    }

    .radio-card:not(.selected) {
      background-color: var(--bg-color);
    }

    .radio-card.selected {
      background-color: #333;
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      z-index: 15;
    }

    .radio-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 2;
    }

    .radio-card[data-status="paused"]::after {
      display: block;
      width: 40px;
      height: 40px;
      background: linear-gradient(
        to right,
        #007bff 12px,
        transparent 12px 18px,
        #007bff 18px 30px,
        transparent 30px
      );
    }

    .radio-card[data-status="connecting"]::after {
      display: block;
      width: 40px;
      height: 40px;
      border: 4px solid #007bff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .radio-card[data-status="error"]::after {
      display: block;
      width: 40px;
      height: 40px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>') no-repeat center;
      background-size: contain;
    }

    audio {
      display: none;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="radio-grid"></div>
  <audio id="radio-player"></audio>
  <script>
    // 注册 Service Worker，支持离线缓存
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const subdir = window.location.pathname.split('/').slice(0, -1).join('/') || '/';
        // 延迟执行以确保初始方向检测准确
        requestAnimationFrame(setGridMaxWidthAndHeight);
        navigator.serviceWorker.register(`${subdir}/sw.js`)
          .catch(err => console.error('Service Worker 注册失败:', err));
      });
    }

    // 获取 DOM 元素
    const radioGrid = document.querySelector('.radio-grid');
    const player = document.getElementById('radio-player');
    let currentCard = null; // 当前选中的卡牌
    let retryTimeout = null; // 重试定时器
    let retryCount = 0; // 重试次数
    const maxRetries = 5; // 最大重试次数
    let isUserPaused = false; // 用户是否手动暂停
    let playCheckInterval = null; // 播放状态检查定时器

    // 设置卡牌网格尺寸和排列方向
    const setGridMaxWidthAndHeight = () => {
      const isLandscape = window.matchMedia('(orientation: landscape)').matches;
      radioGrid.style.display = 'none'; // 隐藏以强制重排
      radioGrid.style.maxWidth = isLandscape ? '775px' : '310px';
      radioGrid.style.maxHeight = isLandscape ? '310px' : 'calc(100vh - 20px)';
      // radioGrid.style.flexFlow = isLandscape ? 'row wrap' : 'column wrap';
      // 重新排列卡牌
      const cards = Array.from(radioGrid.children);
      radioGrid.innerHTML = '';
      cards.forEach(card => radioGrid.appendChild(card));
      // 延迟恢复显示，确保渲染完成
      requestAnimationFrame(() => {
        radioGrid.style.display = 'flex';
      });
    };

    // 监听窗口大小变化和方向变化
    window.addEventListener('resize', () => {
      requestAnimationFrame(setGridMaxWidthAndHeight);
    });
    window.addEventListener('orientationchange', () => {
      requestAnimationFrame(setGridMaxWidthAndHeight);
    });

    // 创建卡牌元素
    const createCard = (name, streamUrl) => {
      const card = document.createElement('div');
      card.className = 'radio-card';
      card.dataset.stream = streamUrl;
      card.innerHTML = `<span>${name}</span>`;
      return card;
    };

    // 更新卡牌状态（播放、暂停、连接中、错误）
    const updateCardStatus = (card, status) => {
      card.dataset.status = status;
    };

    // 绑定卡牌点击事件
    const bindCardEvents = (card) => {
      card.addEventListener('click', () => {
        const streamUrl = card.dataset.stream;
        if (currentCard === card) {
          if (!player.paused) {
            player.pause();
            updateCardStatus(card, 'paused');
            isUserPaused = true;
            localStorage.setItem('lastStatus', 'paused');
          } else {
            isUserPaused = false;
            retryCount = 0;
            retryPlay(card, streamUrl);
          }
        } else {
          document.querySelectorAll('.radio-card').forEach(c => {
            c.classList.remove('selected');
            updateCardStatus(c, '');
          });
          card.classList.add('selected');
          currentCard = card;
          localStorage.setItem('lastStream', streamUrl);
          localStorage.setItem('lastStatus', 'playing');
          isUserPaused = false;
          retryCount = 0;
          retryPlay(card, streamUrl);
        }
      });
    };

    // 重试播放音频
    const retryPlay = (targetCard, streamUrl) => {
      const retryInterval = ('standalone' in navigator && navigator.standalone) ? 5000 : 3000;
      if (retryTimeout) clearTimeout(retryTimeout);
      if (playCheckInterval) clearInterval(playCheckInterval);
      if (player.src === streamUrl && !player.paused && player.currentTime > 0 && player.readyState >= 2) {
        updateCardStatus(targetCard, 'playing');
        isUserPaused = false;
        retryCount = 0;
        return;
      }
      if (retryCount >= maxRetries) {
        updateCardStatus(targetCard, 'error');
        return;
      }
      updateCardStatus(targetCard, 'connecting');
      if (player.src !== streamUrl) {
        player.src = streamUrl;
        player.load();
      }
      player.play().then(() => {
        playCheckInterval = setInterval(() => {
          if (!player.paused && player.currentTime > 0 && player.readyState >= 2) {
            updateCardStatus(targetCard, 'playing');
            isUserPaused = false;
            localStorage.setItem('lastStatus', 'playing');
            retryCount = 0;
            clearInterval(playCheckInterval);
            if (retryTimeout) clearTimeout(retryTimeout);
          } else if (player.paused && player.readyState < 2) {
            updateCardStatus(targetCard, 'error');
            retryCount++;
            if (retryCount < maxRetries) {
              retryTimeout = setTimeout(() => retryPlay(targetCard, streamUrl), retryInterval);
            }
          }
        }, 1000);
      }).catch(err => {
        console.error('播放错误:', err);
        updateCardStatus(targetCard, 'error');
        retryCount++;
        if (retryCount < maxRetries) {
          retryTimeout = setTimeout(() => retryPlay(targetCard, streamUrl), retryInterval);
        }
      });
    };

    // 异步加载 config.json 并渲染卡牌
    const subdir = window.location.pathname.split('/').slice(0, -1).join('/') || '/';
    fetch(`${subdir}/config.json`)
      .then(response => response.json())
      .then(channels => {
        console.log('开始加载频道');
        console.log('频道数据:', Object.keys(channels).slice(0, 10));
        radioGrid.innerHTML = '';
        Object.keys(channels).slice(0, 10).forEach(name => {
          console.log('创建卡牌:', name);
          const card = createCard(name, channels[name]);
          radioGrid.appendChild(card);
          bindCardEvents(card);
        });
        setGridMaxWidthAndHeight();
      })
      .catch(err => {
        console.error('加载频道失败:', err);
        radioGrid.innerHTML = `<p style="text-align: center; padding: 20px;">配置文件 config.json 加载错误。</p>`;
        setGridMaxWidthAndHeight();
      });

    // 配置 Media Session
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: '听音悦台',
        artist: '听音悦台',
        album: '在线音乐电台'
      });
      navigator.mediaSession.setActionHandler('play', () => {
        if (currentCard) {
          isUserPaused = false;
          retryCount = 0;
          retryPlay(currentCard, currentCard.dataset.stream);
        }
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        if (currentCard) {
          player.pause();
          updateCardStatus(currentCard, 'paused');
          isUserPaused = true;
          localStorage.setItem('lastStatus', 'paused');
        }
      });
    }

    // 监听音频播放器事件
    player.addEventListener('waiting', () => {
      if (currentCard && player.src) updateCardStatus(currentCard, 'connecting');
    });
    player.addEventListener('playing', () => {
      if (currentCard && player.src && !player.paused && player.currentTime > 0 && player.readyState >= 2) {
        updateCardStatus(currentCard, 'playing');
        isUserPaused = false;
        localStorage.setItem('lastStatus', 'playing');
        retryCount = 0;
        if (retryTimeout) clearTimeout(retryTimeout);
        if (playCheckInterval) clearInterval(playCheckInterval);
      }
    });
    player.addEventListener('pause', () => {
      if (currentCard && player.src && isUserPaused) {
        updateCardStatus(currentCard, 'paused');
        localStorage.setItem('lastStatus', 'paused');
      }
    });
    player.addEventListener('error', () => {
      if (currentCard && player.src && player.paused && player.readyState < 2) {
        updateCardStatus(currentCard, 'error');
        retryCount++;
        const retryInterval = ('standalone' in navigator && navigator.standalone) ? 5000 : 3000;
        if (retryCount < maxRetries) {
          retryTimeout = setTimeout(() => retryPlay(currentCard, currentCard.dataset.stream), retryInterval);
        }
      }
    });
  </script>
</body>
